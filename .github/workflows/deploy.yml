name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served from the custom domain root, so no base path is needed.
          NEXT_PUBLIC_SITE_URL: https://consumersfilm.com
          # Public by design (the publishable key ships to every browser);
          # Supabase row-level security protects the data.
          NEXT_PUBLIC_SUPABASE_URL: https://bhdbtftuslceglhgyadp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Ysyf9Lrz6xBsV1cMuTF1OQ_GVRFzYAV
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
